name: build

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

env:
  PICO_SDK_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # get-version.sh uses git describe

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

      - name: Fetch pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: recursive

      - name: Build Debug Probe hardware
        run: |
          cmake -G Ninja -S . -B build
          ninja -C build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

      - name: Build Pico
        run: |
          cmake -G Ninja -S . -B build-pico -DDEBUG_ON_PICO=ON -DPICO_BOARD=pico
          ninja -C build-pico
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: uf2
          path: |
            build/debugprobe.uf2
            build-pico/debugprobe_on_pico.uf2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uf2
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $(find . -name '*.uf2')
        env:
          GH_TOKEN: ${{ github.token }}
